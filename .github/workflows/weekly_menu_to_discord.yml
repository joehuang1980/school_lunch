name: Daily Lunch Menu To Discord

on:
  schedule:
    # Sun–Thu 18:50 Asia/Taipei = 10:50 UTC → posts next school day's menu
    - cron: "50 10 * * 0-4"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD). Leave blank for next school day."
        required: false
        default: ""

jobs:
  post-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore posted-date state
        id: state-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .state/posted_dates.json
          key: posted-dates-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            posted-dates-${{ github.ref_name }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post lunch menu to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOURCE_URL: ${{ vars.SOURCE_URL || 'https://www.fhes.tn.edu.tw/' }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/post_menu_to_discord.py $DATE_ARG

      - name: Save posted-date state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/posted_dates.json
          key: posted-dates-${{ github.ref_name }}-${{ github.run_id }}